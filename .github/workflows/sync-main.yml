name: Sync main into branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branch:
          - ble-simulator
          - backend(p3)
          - faculty(p4)
          - faculty(p5)
          - student-check(p2)

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Merge main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git merge origin/main \
            -m "Sync main into ${{ matrix.branch }}" \
            || {
              git merge --abort
              echo "Merge conflict in ${{ matrix.branch }}"
              exit 1
            }

          git push origin ${{ matrix.branch }}
